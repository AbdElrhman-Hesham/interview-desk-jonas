# Pinned Python dependencies for Lena. FROZEN FROM THE WORKING VENV.
#
# Every line is an exact ==. This is the full transitive closure as installed
# on the machine the product is verified on, not a hand-written top-level list,
# because a hand-written list re-resolves transitively and stops being the
# stack that was tested.
#
# Load-bearing entries -- do not "upgrade":
#   ctranslate2 4.8.1        the STT engine; built against CUDA 12 (cublas64_12)
#   faster-whisper 1.2.1     resolves the large-v3-turbo alias; see manifest.json
#   nvidia-cublas-cu12       ⚑ REQUIRED. The ctranslate2 Windows wheel does NOT
#   nvidia-cudnn-cu12        ⚑ bundle cuBLAS and no CUDA Toolkit is installed.
#                            Without these, the model LOADS and then dies at the
#                            first GEMM. Installing them is necessary but not
#                            sufficient: Python 3.8+ ignores PATH for extension
#                            DLLs, so app/providers.py registers
#                            site-packages/nvidia/*/bin via os.add_dll_directory.
#   onnxruntime 1.23.2       Piper inference
#   piper-tts 1.6.0          TTS
#   numpy 2.2.6              pinned deliberately; 2.x ABI matters to the above
#
# Regenerate ONLY from a venv that has passed regress.cmd:
#   lab\.venv\Scripts\python.exe -m pip freeze
